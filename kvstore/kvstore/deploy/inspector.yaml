apiVersion: v1
kind: Pod
metadata:
  name: log-inspector
spec:
  containers:
  - name: inspector
    image: alpine
    imagePullPolicy: IfNotPresent
    command: ["sleep", "3600"]
    volumeMounts:
    - name: storage
      mountPath: "/mnt/log"
  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: translog-kvstore-0  # Matches the StatefulSet PVC
  restartPolicy: Never