services:
  cinema_notifier:
    build: notifier/.
    container_name: cinema_notifier
    env_file:
      - notifier/.env
    restart: unless-stopped
  
  kv-store:
    build:
      context: kvstore/kvstore/
      dockerfile: deploy/Dockerfile
    container_name: kv_store
    restart: unless-stopped
    volumes:
      - kvstore_data:/tmp/kvstore
  
volumes:
  kvstore_data: {}